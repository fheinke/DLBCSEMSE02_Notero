name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  docs:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate KDoc with Dokka
        run: ./gradlew :app:dokkaGenerate --no-daemon

      - name: Upload KDoc artifact
        uses: actions/upload-artifact@v7
        with:
          name: kdoc
          path: app/build/dokka/html
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: app-debug
          path: artifacts

      - name: Show downloaded artifact
        run: ls -la artifacts