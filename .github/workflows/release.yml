name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Note: No signingConfig for 'release' present yet -> assembleDebug produces an installable (debug-signed) APK for the release asset.
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Generate KDoc with Dokka
        run: ./gradlew :app:dokkaGenerate --no-daemon

      - name: Package docs as zip
        run: |
          cd app/build/dokka/html
          zip -r ../../../../notero-docs-${{ github.ref_name }}.zip .

      - name: Rename APK with version
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             notero-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Notero ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            notero-${{ github.ref_name }}.apk
            notero-docs-${{ github.ref_name }}.zip